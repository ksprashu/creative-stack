# The expensive proof: a real bootstrap on a genuinely clean Arch and a
# genuinely clean Ubuntu, as a non-root user with sudo — the shape of an
# Omarchy or Ubuntu desktop.
#
# Weekly rather than per-push because nothing here is under our control: the
# failures this catches are upstream renaming an apt package, dropping an AUR
# package, or shipping a compiler that rejects a vendored crate. Those arrive
# on their own schedule, not on ours.
#
# It reuses scripts/verify_linux.sh rather than reimplementing the containers
# in YAML, so what CI proves and what `make verify` proves stay the same thing.
# The runner is amd64, which is free extra coverage: local runs on Apple
# Silicon exercise Arch Linux ARM and aarch64 wheels instead.

name: bootstrap

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      skip_heavy:
        description: "Skip the multi-GB packages (LaTeX, Blender)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  clean-machine:
    name: clean Arch + Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # --skip-heavy by default: LaTeX is ~4GB and its absence degrades two
      # optional skills, so paying for it weekly buys very little. A manual
      # dispatch can turn it back on before a release.
      - name: bootstrap both distros
        run: |
          args=(--demo)
          # Compared in the shell, not in the ${{ }}. `inputs.skip_heavy` is a
          # real boolean and 'false' is a string, and GitHub resolves a
          # mismatched comparison by coercing both to numbers: false becomes 0,
          # the string 'false' becomes NaN, and every comparison against NaN is
          # false — so `inputs.skip_heavy != 'false'` is true even when the box
          # is unticked, and the input did nothing. Interpolating the value and
          # letting test(1) compare two strings has no such rule. The empty
          # string a scheduled run produces also lands on the default.
          if [ "${{ inputs.skip_heavy }}" != "false" ]; then
            args+=(--skip-heavy)
          fi
          bash scripts/verify_linux.sh "${args[@]}"

      # Uploaded even on failure — the log is the artefact worth reading, and a
      # red X with no log is a run nobody can act on.
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs
          path: out/verify/
          retention-days: 30

      # bootstrap only *warns* when doctor fails — a machine that is 90% there
      # is more useful than one that aborted halfway — so its exit code alone is
      # not proof. Read doctor's own tally instead. The logs are full of colour
      # codes, so strip them first rather than writing a regex that has to step
      # around an escape sequence between the digit and the word.
      - name: doctor found no hard failures
        if: always()
        run: |
          status=0
          for log in out/verify/*.log; do
            name=$(basename "$log" .log)
            plain=$(sed 's/\x1b\[[0-9;]*m//g' "$log")
            tally=$(printf '%s\n' "$plain" \
                    | grep -Eo '[0-9]+ ok +[0-9]+ warn +[0-9]+ fail' | tail -1)
            fails=$(printf '%s\n' "$tally" | grep -Eo '[0-9]+ fail' | cut -d' ' -f1)
            if [ -z "$tally" ]; then
              echo "::error::$name: doctor never printed a summary"
              status=1
            elif [ "$fails" != 0 ]; then
              echo "::error::$name: $tally"
              printf '%s\n' "$plain" | grep -E '^ +✗' | head -20
              status=1
            else
              echo "$name: $tally"
            fi
          done
          exit $status
