# Fast gate on every change. The expensive proof — a real bootstrap on a clean
# Arch and a clean Ubuntu — lives in bootstrap.yml and runs on a schedule.
#
# `--plan` is the cheap half of that proof: it resolves every manifest entry
# against the actual package manager of the actual distro, so a package renamed
# out from under us shows up here in ninety seconds instead of in an hour-long
# install. It is run on all three families because the whole point of the
# manifest is that one file answers for all of them.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: skills + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # validate_skills.py is also the secret gate: it fails on a committed
      # AIza…/sk-…/ghp_… token or a hardcoded /Users/<name>/ path. Keep it first
      # so a leaked key fails the run before anything slower has a chance to.
      - run: python3 scripts/validate_skills.py
      # Pure-function unit tests: standard library only, so no venv is needed.
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/hostenv.py
      - run: python3 scripts/packages.py --emit brewfile
      # The Brewfile is generated from the manifest and checked in. If editing
      # the manifest did not regenerate it, the two have drifted.
      - name: Brewfile matches the manifest
        run: git diff --exit-code Brewfile

  plan:
    name: plan (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu, runner: ubuntu-latest, container: "" }
          - { name: arch, runner: ubuntu-latest, container: "archlinux:latest@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9" }
          - { name: macos, runner: macos-latest, container: "" }
    steps:
      # The Arch image has neither node nor tar, which actions/checkout needs.
      - name: seed arch
        if: matrix.name == 'arch'
        run: |
          sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
          # -Syu, not -Sy: the image's db is frozen at image build time and Arch
          # mirrors keep only the current build of each package, so `-Sy` then
          # install asks for versions that have already been deleted and gets a
          # 404 from every mirror.
          pacman -Syu --noconfirm --needed python git tar nodejs npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/packages.py --plan
      # Every package must resolve to *some* route. A `skip` on a non-optional
      # package means this distro has no way to install something the skills
      # treat as hard-required, which is exactly the Arch pandoc failure.
      - name: no required package is unroutable
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import packages
          data = packages.load()
          pkgs = packages.packages(data, "full", False)
          bad = [p["id"] for p, method, *_ in packages.plan(pkgs)
                 if method == "skip" and not p.get("optional")]
          if bad:
              print("required packages with no route:", ", ".join(bad))
              sys.exit(1)
          print("every required package has a route")
          PY
