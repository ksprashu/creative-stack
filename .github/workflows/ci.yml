# Fast gate on every change: skill lint, the secret scan, unit tests and the
# Brewfile drift check, on one Linux runner. There are no per-distro or
# per-OS jobs; clean-machine coverage is `make verify`, run locally on demand.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: skills + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # validate_skills.py is also the secret gate: it fails on a committed
      # AIza…/sk-…/ghp_… token or a hardcoded /Users/<name>/ path. Keep it first
      # so a leaked key fails the run before anything slower has a chance to.
      - run: python3 scripts/validate_skills.py
      # Pure-function unit tests: standard library only, so no venv is needed.
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/hostenv.py
      - run: python3 scripts/packages.py --emit brewfile
      # The Brewfile is generated from the manifest and checked in. If editing
      # the manifest did not regenerate it, the two have drifted.
      - name: Brewfile matches the manifest
        run: git diff --exit-code Brewfile
